<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe98a"/>
      <stop offset="0.55" stop-color="#ffbe2e"/>
      <stop offset="1" stop-color="#e98a0c"/>
    </linearGradient>
    <linearGradient id="well" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9780a"/>
      <stop offset="1" stop-color="#ffd85c"/>
    </linearGradient>
    <radialGradient id="face" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffcc47"/>
      <stop offset="1" stop-color="#ec9312"/>
    </radialGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="1" stop-color="#ffcb3d"/>
    </linearGradient>
  </defs>
  <!-- edge thickness -->
  <circle cx="32" cy="33.6" r="30" fill="#c0650a"/>
  <!-- rim and sunken face -->
  <circle cx="32" cy="32" r="30" fill="url(#rim)"/>
  <circle cx="32" cy="32" r="23.6" fill="url(#well)"/>
  <circle cx="32" cy="32.6" r="22.2" fill="url(#face)"/>
  <!-- raised fish emblem: shadow, then face -->
  <g transform="translate(0 1.3)" fill="#b35a04" opacity="0.85">
    <path d="M16.5 32C20.5 25 29 22.6 36 27.2L44.5 22.5C42.6 26.8 42.6 37.2 44.5 41.5L36 36.8C29 41.4 20.5 39 16.5 32Z"/>
  </g>
  <path d="M16.5 32C20.5 25 29 22.6 36 27.2L44.5 22.5C42.6 26.8 42.6 37.2 44.5 41.5L36 36.8C29 41.4 20.5 39 16.5 32Z" fill="url(#fish)"/>
  <circle cx="23.4" cy="30.6" r="1.9" fill="#b85c05"/>
  <path d="M30.5 26.6C32.4 29.6 32.4 34.4 30.5 37.4" fill="none" stroke="#e8950f" stroke-width="1.3" stroke-linecap="round"/>
  <!-- shine on the rim -->
  <path d="M7.6 20.4A27 27 0 0 1 20.4 7.6" fill="none" stroke="#fffbe6" stroke-opacity="0.85" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="49.5" cy="13.5" r="1.4" fill="#fffbe6" opacity="0.8"/>
